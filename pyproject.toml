[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Garen", email = "boygaren@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.4",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "numpy>=2.2.6",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sse-starlette>=3.5.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
